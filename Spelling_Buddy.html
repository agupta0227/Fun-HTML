function showG(n){const m=document.createElement('div');m.id='modal';m.onclick=e=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="mbox">${gc(D[n-1])}<div class="acts c"><button class="btn big" onclick="this.closest('#modal').remove()">Close</button></div></div>`;document.body.appendChild(m);say(D[n-1].w)}
function cnt(){const k=known.size;$('#cnt').innerHTML=`<b style="color:var(--ok)">✓ ${k} known</b> &nbsp; <b style="color:var(--bad)">? ${cur.length-k} to learn</b>`}
const gc=w=>{const o=ORI[w.w.toLowerCase()],i=w.n-1;return`<div class="card gc"><div class="em">${EM[w.w.toLowerCase()]||['🐝','🌟','🏆'][w.tier]}</div><div><h3>${w.w}${w.alts.length?` <small>(or ${w.alts.join(', ')})</small>`:''}</h3><div class="syl">${w.syl.replace(/-/g,' · ')}</div><div class="say">Say it: <b>${w.resp}</b></div><div class="letters" style="font-size:1.2rem">${spell(w)}</div><div style="margin-top:.3rem"><i>${w.pos}</i> – ${w.def}</div>${w.sen.length?`<div class="sen">${w.sen.map(s=>`<p>💬 ${s}</p>`).join('')}</div>`:''}${o?`<div class="tag">🌍 From ${o}</div>`:''}<div class="acts"><button class="btn alt" onclick="say(D[${i}].w)">🔊 Word</button><button class="btn alt" onclick="sayLetters(${i})">🔤 Letters</button><button class="btn alt" onclick="say(D[${i}].def.replace(/ : /g,', '),.85)">🗣️ Meaning</button>${w.sen.length?`<button class="btn alt" onclick="say(D[${i}].sen[0],.85)">💬 Sentence</button>`:''}</div></div></div>`};
function toGuide(){app.className='wide';const unk=cur.filter(w=>!known.has(w.n));addWeak(unk.map(w=>w.n));
if(!unk.length){startTest(cur);return}
app.innerHTML=`<div class="card hd"><h2>Your guide: ${unk.length} word${unk.length>1?'s':''} to learn</h2><p>Read, listen, then start the test when you're ready.</p><button class="btn big" onclick="startTest(cur)">Start the test →</button></div><div class="gg">${unk.map(gc).join('')}</div><div class="acts c"><button class="btn big" onclick="startTest(cur)">Start the test →</button></div>`;scrollTo(0,0)}
function startTest(list){app.className='';T={list,i:0,res:[],done:false};showWord()}
function showWord(){const w=T.list[T.i];T.sc=-1;app.innerHTML=`<div class="card"><div class="meta">Word ${T.i+1} of ${T.list.length}</div><div class="bar"><i id="bar"></i></div><div id="clock">30</div><div class="acts c"><button class="btn" onclick="say(T.list[T.i].w)">🔊 Say it again</button><button class="btn alt" onclick="ask()">📖 Meaning</button>${w.sen.length?'<button class="btn alt" onclick="askS()">💬 Sentence</button>':''}</div><p id="hint" class="res"></p><input id="ans" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="type here" onkeydown="if(event.key=='Enter')finish()"><div class="acts c"><button class="btn big" onclick="finish()">Check ✓</button></div></div>`;
say(w.w);$('#ans').focus();T.end=Date.now()+30000;clearInterval(T.tm);T.tm=setInterval(()=>{const r=Math.max(0,(T.end-Date.now())/1000);$('#bar').style.width=r/30*100+'%';$('#bar').className=r<=10?'low':'';$('#clock').textContent=Math.ceil(r);if(r<=0)finish(true)},100)}
function askS(){const s=T.list[T.i].sen;T.sc=(T.sc+1)%s.length;$('#hint').textContent='🔈 Listen to the sentence…';say(s[T.sc],.85)}
function ask(){const w=T.list[T.i];$('#hint').innerHTML=`<i>${w.pos}</i> – ${w.def}`;say(w.def.replace(/ : /g,', '),.85)}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[\s-]/g,'');
function finish(timeout){if(T.done)return;T.done=true;clearInterval(T.tm);const w=T.list[T.i],v=($('#ans')||{value:''}).value.trim(),ok=!timeout&&v!==''&&[w.w,...w.alts].some(x=>norm(x)===norm(v));
T.res.push({w,ok,v});ok?delWeak(w.n):addWeak([w.n]);
app.innerHTML=`<div class="card res"><div class="big">${ok?'✅':'❌'}</div><h2>${ok?'Correct!':timeout?"Time's up!":'Not quite'}</h2><div class="letters">${spell(w)}</div>${!ok&&v?`<p>You typed: <b>${v}</b></p>`:''}<div class="acts c"><button class="btn alt" onclick="say(T.list[T.i].w)">🔊 Hear it</button><button class="btn big" onclick="nxt()">${T.i+1<T.list.length?'Next word →':'See my score →'}</button></div></div>`;if(ok)confetti(8)}
function nxt(){T.i++;T.done=false;T.i>=T.list.length?results():showWord()}
function results(){app.className='wide';const n=T.res.filter(r=>r.ok).length,len=T.list.length,miss=T.res.filter(r=>!r.ok).map(r=>r.w);
if(len==50){const h=store.get('hist',{});h[dayN]=n;store.set('hist',h)}
const msg=n==len?'🏆 PERFECT! Spelling champion!':n/len>=.9?'🌟 Amazing work!':n/len>=.7?'👏 Great job!':'💪 Keep going, practice makes progress!';
app.innerHTML=`<div class="card res"><div class="score">${n} / ${len}</div><h2>${msg}</h2>${miss.length?`<p>${miss.length} to practice again below.</p><div class="acts c"><button class="btn big" onclick="startTest(shuffle(${JSON.stringify(miss.map(w=>w.n))}.map(n=>D[n-1]),Math.random))">Retry missed words</button><button class="btn alt" onclick="home()">Home</button></div>`:'<button class="btn big" onclick="home()">Home</button>'}</div><div class="gg">${miss.map(gc).join('')}</div>`;scrollTo(0,0);if(n/len>=.7)confetti(40)}
function confetti(k){const e=['🎉','⭐','✨','🐝','🎊'];for(let i=0;i<k;i++){const s=document.createElement('span');s.className='c';s.textContent=e[i%5];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{};
prefs();home();
</script></body></html>
